<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ʀᴏʏᴀʟㅤ⚜ㅤʙʟᴏᴏᴅ</title>

<link rel="icon" type="image/png" href="logo.png">
<link rel="manifest" href="manifest.json">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 16px;

  font-family: Arial, sans-serif;
  color: white;

  background:
    linear-gradient(
      rgba(5, 7, 11, 0.92),
      rgba(5, 7, 11, 0.97)
    ),
    url("logo.png");

  background-size: 380px;
  background-position: center;
  background-repeat: no-repeat;
  background-attachment: fixed;
}

.card {
  width: 100%;
  max-width: 430px;

  background: rgba(13, 18, 29, 0.98);

  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 24px;

  padding: 26px;

  box-shadow: 0 20px 60px rgba(0,0,0,0.55);
}

.guild-logo {
  width: 105px;
  height: 105px;

  object-fit: contain;
  display: block;

  margin: 0 auto 12px;
}

h1 {
  text-align: center;
  font-size: 23px;
  margin: 8px 0;
}

.subtitle {
  text-align: center;
  color: #aab4c7;
  font-size: 13px;

  margin-bottom: 24px;
}

label {
  display: block;

  color: #b9c2d3;
  font-size: 13px;

  margin-bottom: 8px;
}

.gender-buttons {
  display: flex;
  gap: 10px;
}

.gender-button {
  flex: 1;

  padding: 14px;

  border: none;
  border-radius: 13px;

  background: #080c14;
  color: white;

  border: 1px solid #344056;

  font-size: 14px;
  font-weight: bold;

  cursor: pointer;
}

.gender-button.active {
  background: #7f8da8;
  border-color: #7f8da8;
}

input {
  width: 100%;

  padding: 15px;

  border-radius: 13px;

  border: 1px solid #344056;

  background: #080c14;
  color: white;

  font-size: 16px;

  outline: none;
}

input::placeholder {
  color: #667085;
}

input:focus {
  border-color: #8c9ab5;
}

.preview {
  margin-top: 20px;

  padding: 22px 10px;

  background: #080c14;

  border: 1px solid #344056;

  border-radius: 16px;

  text-align: center;

  overflow-x: auto;
}

.preview-title {
  color: #8792a7;

  font-size: 12px;

  margin-bottom: 10px;
}

#result {
  font-size: 22px;
  font-weight: bold;

  white-space: nowrap;
}

#copyButton {
  width: 100%;

  margin-top: 14px;

  padding: 14px;

  border: none;
  border-radius: 13px;

  background: white;
  color: #080b12;

  font-size: 15px;
  font-weight: bold;

  cursor: pointer;
}

#copyButton:active {
  transform: scale(0.97);
}

.copy-success {
  background: #7f8da8 !important;
  color: white !important;
}

.info {
  text-align: center;

  margin-top: 18px;

  color: #778298;

  font-size: 11px;
}

@media (max-width: 480px) {

  body {
    padding: 10px;
  }

  .card {
    padding: 22px 18px;
    border-radius: 20px;
  }

  .guild-logo {
    width: 90px;
    height: 90px;
  }

  h1 {
    font-size: 20px;
  }

  .subtitle {
    font-size: 12px;
  }

  #result {
    font-size: 19px;
  }
}

@media (max-width: 360px) {

  .card {
    padding: 20px 14px;
  }

  .guild-logo {
    width: 80px;
    height: 80px;
  }

  h1 {
    font-size: 18px;
  }

  #result {
    font-size: 17px;
  }
}
</style>
</head>


<body>

<div class="card">

  <img
    src="logo.png"
    alt="Royal Blood Logo"
    class="guild-logo"
  >

  <h1>
    ʀᴏʏᴀʟㅤ⚜ㅤʙʟᴏᴏᴅ
  </h1>

  <div class="subtitle">
    Guild Name Generator
  </div>


  <label>
    Choose your style
  </label>

  <div class="gender-buttons">

    <button
      type="button"
      id="maleBtn"
      class="gender-button active"
    >
      ⚜ MALE
    </button>

    <button
      type="button"
      id="femaleBtn"
      class="gender-button"
    >
      ❀ FEMALE
    </button>

  </div>


  <label
    for="name"
    style="margin-top:20px;"
  >
    Enter your Free Fire name
  </label>

  <input
    id="name"
    type="text"
    maxlength="20"
    placeholder="Enter your name"
    autocomplete="off"
  >


  <div class="preview">

    <div class="preview-title">
      YOUR GUILD NAME
    </div>

    <div id="result">
      ʀʙㅤ⚜ㅤɴᴀᴍᴇ
    </div>

  </div>


  <button
    type="button"
    id="copyButton"
  >
    📋 COPY NAME
  </button>


  <div class="info">
    Official ʀᴏʏᴀʟㅤ⚜ㅤʙʟᴏᴏᴅ name format
  </div>

</div>


<script>

"use strict";


/* =========================
   SETTINGS
========================= */

const MALE_PREFIX = "ʀʙㅤ⚜ㅤ";

const FEMALE_PREFIX = "ʀʙㅤ❀ㅤ";


/* =========================
   ELEMENTS
========================= */

const nameInput = document.getElementById("name");

const result = document.getElementById("result");

const maleButton = document.getElementById("maleBtn");

const femaleButton = document.getElementById("femaleBtn");

const copyButton = document.getElementById("copyButton");


/* =========================
   CURRENT STYLE
========================= */

let selectedStyle = "male";


/* =========================
   SMALL CAPS
========================= */

const SMALL_CAPS = {

  a: "ᴀ",
  b: "ʙ",
  c: "ᴄ",
  d: "ᴅ",
  e: "ᴇ",
  f: "ꜰ",
  g: "ɢ",
  h: "ʜ",
  i: "ɪ",
  j: "ᴊ",
  k: "ᴋ",
  l: "ʟ",
  m: "ᴍ",
  n: "ɴ",
  o: "ᴏ",
  p: "ᴘ",
  q: "q",
  r: "ʀ",
  s: "s",
  t: "ᴛ",
  u: "ᴜ",
  v: "ᴠ",
  w: "ᴡ",
  x: "x",
  y: "ʏ",
  z: "ᴢ"

};


/* =========================
   CONVERT NAME
========================= */

function convertToSmallCaps(name) {

  let output = "";

  for (const character of name) {

    const lowerCharacter =
      character.toLowerCase();

    if (
      Object.prototype.hasOwnProperty.call(
        SMALL_CAPS,
        lowerCharacter
      )
    ) {

      output +=
        SMALL_CAPS[lowerCharacter];

    } else {

      output += character;

    }

  }

  return output;

}


/* =========================
   GENERATE NAME
========================= */

function generateName() {

  const typedName =
    nameInput.value.trim();


  let prefix;


  if (selectedStyle === "male") {

    prefix = MALE_PREFIX;

  } else {

    prefix = FEMALE_PREFIX;

  }


  if (typedName === "") {

    if (selectedStyle === "male") {

      result.textContent =
        MALE_PREFIX + "ɴᴀᴍᴇ";

    } else {

      result.textContent =
        FEMALE_PREFIX + "ꜰᴇᴍᴀʟᴇɴᴀᴍᴇ";

    }

    return;

  }


  const convertedName =
    convertToSmallCaps(typedName);


  result.textContent =
    prefix + convertedName;

}


/* =========================
   MALE BUTTON
========================= */

maleButton.addEventListener(
  "click",
  function () {

    selectedStyle = "male";

    maleButton.classList.add("active");

    femaleButton.classList.remove("active");

    generateName();

  }
);


/* =========================
   FEMALE BUTTON
========================= */

femaleButton.addEventListener(
  "click",
  function () {

    selectedStyle = "female";

    femaleButton.classList.add("active");

    maleButton.classList.remove("active");

    generateName();

  }
);


/* =========================
   ENTER KEY GENERATION
========================= */

nameInput.addEventListener(
  "keydown",
  function (event) {

    if (event.key === "Enter") {

      event.preventDefault();

      generateName();

      nameInput.blur();

    }

  }
);

/* =========================
   COPY NAME
========================= */

copyButton.addEventListener(
  "click",
  async function () {

    const typedName =
      nameInput.value.trim();


    if (typedName === "") {

      copyButton.textContent =
        "⚠ ENTER YOUR NAME";

      setTimeout(function () {

        copyButton.textContent =
          "📋 COPY NAME";

      }, 1800);

      return;

    }


    const finalName =
      result.textContent;


    try {

      await navigator.clipboard.writeText(
        finalName
      );

    } catch (error) {

      const temporary =
        document.createElement("textarea");

      temporary.value = finalName;

      temporary.style.position = "fixed";
      temporary.style.opacity = "0";

      document.body.appendChild(
        temporary
      );

      temporary.focus();

      temporary.select();

      document.execCommand("copy");

      temporary.remove();

    }


    copyButton.textContent =
      "✓ COPIED!";

    copyButton.classList.add(
      "copy-success"
    );


    setTimeout(function () {

      copyButton.textContent =
        "📋 COPY NAME";

      copyButton.classList.remove(
        "copy-success"
      );

    }, 1800);

  }
);


/* =========================
   START GENERATOR
========================= */

generateName();

</script>

</body>
</html>
